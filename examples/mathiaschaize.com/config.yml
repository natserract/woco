model:
  - name: "jewellery/earing"

    image:
      path: "mathiaschaize.com/upload/shop/earing"
      sort:
        name: "uploaded_at"
        order_by: "desc"
      max_results: 300

    product:
      type: "simple"
      prefix: "ER"
      price:
        euro:
          value: 75
          default: true
          currency: EURO
        idr:
          value: 1200000
          currency: IDR

      stock_status: "instock"
      categories:
        - jewellery:
            id: 27
            name: "Jewellery"
            slug: "jewellery"

        - earring:
            id: 29
            name: "Earring"
            slug: "earring"
